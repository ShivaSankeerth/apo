[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apo"
version = "0.1.0"
description = "Automatic Prompt Optimization Framework"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "APO Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "jinja2>=3.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
gemini = [
    "google-generativeai>=0.3.0",
]
ollama = [
    "ollama>=0.1.0",
]
cohere = [
    "cohere>=4.0.0",
]
mistral = [
    "mistralai>=0.0.7",
]
all-providers = [
    "google-generativeai>=0.3.0",
    "ollama>=0.1.0",
    "cohere>=4.0.0",
    "mistralai>=0.0.7",
]

[project.urls]
Homepage = "https://github.com/ShivaSankeerth/apo"
Repository = "https://github.com/ShivaSankeerth/apo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=apo --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
